<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Twilight of the World — M0</title>
  <!-- Шрифты дизайн-системы (фолбэк на sans/mono при оффлайне) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <!-- Загрузчик: подключает модули по порядку с cache-busting (?v=…), чтобы во
       время разработки браузер не отдавал старые версии файлов. document.write
       выполняет скрипты синхронно, порядок сохраняется. -->
  <script>
    ['constants', 'save', 'world', 'input', 'unit', 'camera', 'city', 'cycle', 'unitdefs', 'anim', 'rig', 'inventory', 'upgrades', 'loot', 'effects', 'intro', 'enemy',
      'render_resource', 'render_module', 'render_world', 'render_loot', 'render_fx', 'render_parts', 'render_unit', 'render_light', 'render_enemy', 'render_intro', 'render_city', 'render_glitch', 'hud', 'ui_menu', 'game', 'ai']
      .forEach(function (f) { document.write('<script src="' + f + '.js?v=' + Date.now() + '"><\/script>'); });
  </script>
</body>
</html>
