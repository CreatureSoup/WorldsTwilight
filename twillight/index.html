<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Twilight of the World — M0</title>
  <!-- Шрифты дизайн-системы (фолбэк на sans/mono при оффлайне) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Лоадер: лаконичный прогресс-бар на время загрузки модулей (палитра PAL). */
    #loader { position: fixed; inset: 0; z-index: 9999; background: #07050a;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .4s ease; }
    #loader.hide { opacity: 0; pointer-events: none; }
    #loader .ld-inner { width: min(340px, 62vw); text-align: center;
      font-family: 'JetBrains Mono', ui-monospace, monospace; }
    #loader .ld-title { color: #d4a042; font-size: 11px; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase; margin-bottom: 16px; }
    #loader .ld-track { height: 3px; background: #3a302a; border-radius: 2px; overflow: hidden; }
    #loader #ld-fill { height: 100%; width: 0; background: #d4a042;
      box-shadow: 0 0 8px rgba(242, 200, 120, .6); transition: width .14s ease; }
    #loader .ld-pct { color: #5a5046; font-size: 10px; letter-spacing: .2em; margin-top: 10px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loader"><div class="ld-inner">
    <div class="ld-title">// ЗАГРУЗКА СИСТЕМЫ</div>
    <div class="ld-track"><div id="ld-fill"></div></div>
    <div class="ld-pct" id="ld-pct">0%</div>
  </div></div>
  <!-- Загрузчик: модули грузятся ПАРАЛЛЕЛЬНО, но `async=false` держит ПОРЯДОК выполнения
       (= порядок массива). cache-busting (?v=…) — чтобы в разработке не отдавался старый файл.
       Не блокирует перерисовку → прогресс-бар анимируется. Игру стартует bootGame по завершении. -->
  <script>
    (function () {
      var files = ['i18n', 'lang_ru_constants', 'constants', 'lang_ru', 'lang_ru_worldmisc', 'lang_ru_scanaux', 'lang_ru_inventory', 'lang_ru_fx', 'lang_ru_upgrades', 'lang_ru_upgdata', 'lang_ru_widgets', 'lang_ru_invdata', 'lang_ru_metadom', 'lang_ru_codex', 'lang_ru_meta', 'lang_ru_log', 'save', 'meta', 'world', 'input', 'unit', 'camera', 'city', 'firewall', 'cycle', 'unitdefs', 'anim', 'rig', 'inventory', 'upgrades', 'loot', 'effects', 'projectiles', 'falling', 'nav', 'dust', 'visions', 'hints', 'intro', 'enemy', 'structures', 'radar', 'hud_layout',
        'render_resource', 'render_module', 'render_world', 'render_backdrop', 'render_falling', 'render_dust', 'render_loot', 'render_fx', 'render_parts', 'module_assets', 'render_unit', 'render_ring', 'render_wheel', 'render_sprut', 'render_light', 'render_scan', 'render_visions', 'render_hint', 'render_enemy', 'render_structure', 'render_alert', 'render_predict', 'render_radar', 'render_intro', 'render_city', 'render_firewall', 'render_inventory', 'render_upgrades', 'render_glitch', 'render_impulse', 'render_siege', 'render_stealth', 'render_jam', 'render_borer', 'render_cable', 'render_courier', 'render_jets', 'render_drones', 'render_artifact', 'render_scanners', 'render_hazards', 'render_traps', 'render_container', 'render_hack', 'render_actionbar', 'render_economy', 'render_cityturret', 'legik', 'tentacles', 'sprut', 'rigbridge', 'rig-core', 'rig-gun', 'hud', 'ui_menu', 'meta_dom', 'codex_dom', 'game', 'datascan', 'nav_run', 'print', 'impulse', 'siege', 'stealth', 'jam', 'borers', 'artifact', 'artifacts_active', 'scanners', 'hazards', 'traps', 'containers', 'hack', 'actionbar', 'cable', 'courier', 'jets', 'drones', 'economy', 'cityturret', 'cannon', 'wildcity', 'ai', 'blight', 'sandbox'];
      var total = files.length, v = Date.now(), loaded = 0;
      // CSS DOM-оверлеев (мета-экран + база данных; cache-bust как у JS)
      var mcss = document.createElement('link'); mcss.rel = 'stylesheet'; mcss.href = 'meta_dom.css?v=' + v; document.head.appendChild(mcss);
      var ccss = document.createElement('link'); ccss.rel = 'stylesheet'; ccss.href = 'codex_dom.css?v=' + v; document.head.appendChild(ccss);
      var fill = document.getElementById('ld-fill'), pct = document.getElementById('ld-pct');
      var failed = [];                            // упавшие модули — бут НЕ стартует (audit_2026-08: старт с дырой в глобалах падал посреди сессии)
      function fatal(msg) {
        var ld = document.getElementById('loader');
        if (ld) ld.innerHTML = '<div style="color:#ff6a4a;font:600 15px/1.6 monospace;text-align:center;padding:40px;white-space:pre-wrap">ОШИБКА ЗАГРУЗКИ\n' + msg + '\n\nИгра не запущена — проверь консоль/файлы и перезагрузи.</div>';
      }
      function tick() {
        loaded++;
        var p = Math.round(loaded / total * 100);
        if (fill) fill.style.width = p + '%';
        if (pct) pct.textContent = p + '%';
        if (loaded >= total) finish();
      }
      function finish() {
        if (failed.length) { fatal('Не загрузились модули: ' + failed.join(', ')); return; }   // СТОП: лучше явный отказ, чем «дыра в глобалах»
        // смоук обязательных глобалов: битый файл (синтаксис/TypeError при top-level STR.*) молча оставил бы дыру
        var need = ['STR', 'PAL', 'TILE', 'UNIT_DEFS', 'HULL_DEFS', 'MODULE_DEFS', 'Game', 'Unit', 'World', 'Enemy', 'drawInventory', 'metaHas'];
        // ⚠️ const/class — глобальные ЛЕКСИЧЕСКИЕ биндинги (не window.*) → проверка только через indirect eval
        var miss = need.filter(function (g) { try { return (0, eval)('typeof ' + g) === 'undefined'; } catch (e) { return true; } });
        if (miss.length) { fatal('Модули загрузились, но глобалы не определены: ' + miss.join(', ') + '\n(вероятно, ошибка выполнения в одном из файлов — см. консоль)'); return; }
        var ld = document.getElementById('loader');
        if (ld) { ld.classList.add('hide'); setTimeout(function () { ld.style.display = 'none'; }, 450); }
        if (window.bootGame) window.bootGame();   // все модули выполнены → стартуем игру
      }
      files.forEach(function (f) {
        var s = document.createElement('script');
        s.async = false;                          // параллельная загрузка, но выполнение В ПОРЯДКЕ вставки
        s.src = f + '.js?v=' + v;
        s.onload = tick;
        s.onerror = function () { console.error('Не загрузился модуль: ' + f); failed.push(f); tick(); };
        document.head.appendChild(s);
      });
    })();
  </script>
  <!-- DEV: тизер (tools/teaser.js). Геймплей-webm рендерится из консоли (Teaser.makeInit/makeStep/makeMux).
       ЖИВАЯ съёмка экрана по хоткеям: Shift+U — воспроизвести геймплей-рил CLIP3 «ОБНОВЛЕНИЕ» на канвасе,
       Shift+M — мета (зум-аут/разрастание), Shift+J — диск данных, Shift+X — стоп (вернуть сейв). УБРАТЬ ПЕРЕД РЕЛИЗОМ. -->
  <script>
    window.addEventListener('load', function () {
      var t = document.createElement('script'); t.src = 'tools/teaser.js?v=' + Date.now(); document.head.appendChild(t);
      window.addEventListener('keydown', function (e) {
        if (!e.shiftKey || !window.Teaser) return;
        if (e.code === 'KeyU' && window.Teaser.playClip) { console.log('▶ Teaser.playClip("clip3")'); window.Teaser.playClip('clip3'); }
        if (e.code === 'KeyM') { console.log('● Teaser.recMeta()'); window.Teaser.recMeta(); }
        if (e.code === 'KeyJ') { console.log('● Teaser.recDisk()'); window.Teaser.recDisk(); }
        if (e.code === 'KeyX' && window.Teaser.recStop) { console.log('⏹ Teaser.recStop()'); window.Teaser.recStop(); }
      });
    });
  </script>
</body>
</html>
